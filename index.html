<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link omzetten</title>
<style>
  :root {
    --bg: #eef2f4; --ink: #14232b; --muted: #56676f;
    --panel: #ffffff; --line: #c9d4d9; --accent: #0b6e8a; --accent-ink: #ffffff;
    --err: #a3262a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a20; --ink: #e6eef1; --muted: #93a6ae;
      --panel: #16252d; --line: #2b3f49; --accent: #4fb6d3; --accent-ink: #08222b; --err: #ff8a8d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=url] { width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input[type=url]:focus-visible, button:focus-visible, .seg input:focus-visible + span {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  .seg { display: flex; gap: 8px; margin: 18px 0 22px; }
  .seg label { flex: 1; margin: 0; font-weight: 500; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; }
  .seg span { display: block; text-align: center; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); font-weight: 700; }
  button { width: 100%; padding: 13px; font: inherit; font-weight: 700; cursor: pointer;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; }
  button:disabled { opacity: .6; cursor: progress; }
  #status { min-height: 1.5em; margin: 16px 0 0; color: var(--muted); }
  #status.error { color: var(--err); }
  .note { margin-top: 22px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>YouTube-link omzetten</h1>
  <p class="sub">Plak een link en kies mp3 (alleen geluid) of mp4 (video).</p>

  <label for="url">YouTube-link</label>
  <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

  <div class="seg" role="radiogroup" aria-label="Formaat">
    <label><input type="radio" name="fmt" value="mp3" checked><span>mp3</span></label>
    <label><input type="radio" name="fmt" value="mp4"><span>mp4</span></label>
  </div>

  <button id="go">Omzetten</button>
  <p id="status" role="status" aria-live="polite"></p>

  <p class="note">Gebruik dit alleen voor eigen content, content met toestemming of
    rechtenvrije video's. Downloaden van andere video's gaat in tegen de voorwaarden van YouTube.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const status = (t, err) => { $("status").textContent = t; $("status").className = err ? "error" : ""; };

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim();
  const format = document.querySelector("input[name=fmt]:checked").value;
  if (!url) return status("Plak eerst een YouTube-link.", true);

  $("go").disabled = true;
  status("Bezig met omzetten, dit kan even duren…");
  try {
    const res = await fetch("/convert", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format })
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || "Onbekende fout");
    }
    const blob = await res.blob();
    const cd = res.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const name = m ? decodeURIComponent(m[1]) : "download." + format;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    status("Klaar: " + name);
  } catch (e) {
    status(e.message.includes("Failed to fetch")
      ? "Server niet bereikbaar. Start eerst server.py en open http://localhost:5000."
      : e.message, true);
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
